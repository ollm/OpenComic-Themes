name: Validate themes

on:
  pull_request:
    paths:
      - '.github/workflows/validate-themes.yml'
      - 'manifest-sample.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-themes.yml'
      - 'manifest-sample.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate themes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build theme packages and catalog
        run: npm run build:catalog
